services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: testops-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -Q 'SELECT 1') || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    container_name: testops-web
    ports:
      - "8080:80"
    environment:
      TESTOPS_HOST: "sql"
      TESTOPS_DB: "TestOps"
      TESTOPS_USER: "sa"
      TESTOPS_PASSWORD: "Str0ng!Passw0rd"
    volumes:
      - ./web:/var/www/html
    depends_on:
      sql:
        condition: service_healthy
